name: Tests

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Ruff (lint)
        run: ruff check .
      - name: Ruff (format)
        run: ruff format --check .
      - name: Mypy
        run: mypy

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -v --cov --cov-report=xml --cov-report=term
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the network
        run: docker compose up -d --build
      - name: Wait for relays and the hidden service
        run: |
          for i in $(seq 1 60); do
            if docker compose exec -T hidden-service test -s /keys/hs-hostname \
               && docker compose logs hidden-service | grep -q "Published descriptor"; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Message to an exit node
        run: >-
          docker compose run --rm client python -m minitor.network.client
          --dir-host dir-server --dir-key @/keys/directory.pub -m "hello from CI"
      - name: Browse through the SOCKS proxy
        run: curl --fail --silent --show-error --retry 5 --retry-all-errors --socks5-hostname 127.0.0.1:9050 http://echo-server:7000/
      - name: Reach the hidden service
        run: |
          ONION=$(docker compose exec -T hidden-service cat /keys/hs-hostname | tr -d '\r\n')
          echo "Onion address: $ONION"
          curl --fail --silent --show-error --retry 5 --retry-all-errors --socks5-hostname 127.0.0.1:9050 "http://$ONION/"
      - name: Visualization page
        run: curl --fail --silent http://127.0.0.1:8080/ | grep -q "MiniTor Live"
      - name: Logs
        if: always()
        run: docker compose logs
