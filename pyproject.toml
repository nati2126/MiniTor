[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "minitor"
version = "0.3.0"
description = "An educational, Tor-inspired onion routing network in Python"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
minitor-directory = "minitor.network.directory_server:main"
minitor-relay = "minitor.network.relay_node:main"
minitor-client = "minitor.network.client:main"
minitor-hs = "minitor.network.hidden_service:main"
minitor-echo = "minitor.network.echo_server:main"
minitor-viz = "minitor.viz.server:main"

[tool.setuptools.packages.find]
include = ["minitor*"]

[tool.setuptools.package-data]
"minitor.viz" = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["minitor"]
concurrency = ["thread"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:", "def main\\("]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF012", "SIM105"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.10"
packages = ["minitor"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
