[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "minitor"
version = "0.2.0"
description = "An educational, Tor-inspired onion routing network in Python"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
minitor-directory = "minitor.network.directory_server:main"
minitor-relay = "minitor.network.relay_node:main"
minitor-client = "minitor.network.client:main"
minitor-echo = "minitor.network.echo_server:main"

[tool.setuptools.packages.find]
include = ["minitor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
